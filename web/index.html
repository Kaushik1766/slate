<!DOCTYPE html>
<html lang="en" data-booting="true">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Slate</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<link rel="stylesheet" href="/vendor/phosphor/style.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Ambient layer. The blurred artwork is what the glass actually refracts;
     without something behind it, frosted panels read as flat grey boxes. -->
<div class="ambient" aria-hidden="true">
  <video class="ambient__clip" id="ambientClip" muted loop playsinline
         preload="auto" disablepictureinpicture></video>
  <img class="ambient__clip" id="ambientStill" alt="">
  <div class="ambient__art" id="ambientArt"></div>
  <div class="ambient__glow ambient__glow--a"></div>
  <div class="ambient__glow ambient__glow--b"></div>
</div>
<div class="grain" aria-hidden="true"></div>

<div class="shell">

  <header class="rail">
    <div class="rail__id">
      <span class="rail__host" id="hostName">&nbsp;</span>
      <span class="rail__os" id="osName"></span>
    </div>

    <div class="rail__link" id="connChip" data-state="connecting">
      <i class="ph ph-circle-notch" id="connIcon" aria-hidden="true"></i>
      <span id="connText">Connecting</span>
    </div>

    <div class="rail__actions">
      <button type="button" class="iconbtn" id="wakeBtn" aria-pressed="false"
              title="Keep the screen awake">
        <i class="ph ph-eye" aria-hidden="true"></i>
        <span class="sr-only">Keep the screen awake</span>
      </button>
      <button type="button" class="iconbtn" id="themeBtn" title="Switch theme">
        <i class="ph ph-sun" id="themeIcon" aria-hidden="true"></i>
        <span class="sr-only">Switch between light and dark</span>
      </button>
      <button type="button" class="iconbtn" id="perfBtn" aria-pressed="false"
              title="Performance mode">
        <i class="ph ph-gauge" id="perfIcon" aria-hidden="true"></i>
        <span class="sr-only">Toggle lite performance mode</span>
      </button>
      <button type="button" class="iconbtn" id="fsBtn" title="Full screen">
        <i class="ph ph-arrows-out" id="fsIcon" aria-hidden="true"></i>
        <span class="sr-only">Toggle full screen</span>
      </button>
    </div>
  </header>

  <main class="grid">

    <!-- ---------------------------------------------------------- clock -->
    <section class="tile tile--clock">
      <div class="clock">
        <div class="clock__time">
          <span class="clock__hm" id="clockHM">--:--</span><span class="clock__s" id="clockS">00</span>
        </div>
        <div class="clock__date" id="clockDate">&nbsp;</div>
      </div>
      <div class="wx" id="wx" hidden>
        <div class="wx__now">
          <i class="ph ph-cloud wx__icon" id="wxIcon" aria-hidden="true"></i>
          <div class="wx__reading">
            <span class="wx__temp num" id="wxTemp">--</span>
            <span class="wx__deg">&deg;</span>
          </div>
          <div class="wx__meta">
            <span class="wx__text" id="wxText">&nbsp;</span>
            <span class="wx__sub num" id="wxSub">&nbsp;</span>
          </div>
        </div>
        <div class="wx__hours" id="wxHours"></div>
      </div>

      <div class="clock__foot">
        <span class="meta"><span class="meta__k">Up</span><span class="meta__v num" id="uptime">--</span></span>
        <span class="meta"><span class="meta__k">Tasks</span><span class="meta__v num" id="procs">--</span></span>
      </div>
    </section>

    <!-- ---------------------------------------------------------- media -->
    <section class="tile tile--media" id="mediaTile" data-state="idle">

      <div class="media__main">
        <div class="media__art" id="artFrame">
          <div class="media__bloom" id="artBloom" aria-hidden="true"></div>
          <div class="media__plate">
            <img id="artImg" alt="" hidden>
            <div class="media__art-empty" aria-hidden="true"><i class="ph ph-music-notes"></i></div>
          </div>
          <svg class="media__ring" viewBox="0 0 100 100" aria-hidden="true">
            <rect class="media__ring-track" x="1.6" y="1.6" width="96.8" height="96.8" rx="13"></rect>
            <rect class="media__ring-value" id="artRing" x="1.6" y="1.6" width="96.8" height="96.8" rx="13"></rect>
          </svg>
        </div>

        <div class="media__body">
          <div class="media__source" id="mediaSource"></div>
          <h1 class="media__title"><span class="media__title-text" id="mediaTitle">Nothing playing</span></h1>
          <p class="media__artist" id="mediaArtist">Start something on this PC and it shows up here.</p>

          <div class="media__scrub" id="scrub">
            <span class="num media__t" id="posText">0:00</span>
            <input type="range" class="range range--seek" id="seek"
                   min="0" max="1000" value="0" step="1" aria-label="Playback position">
            <span class="num media__t" id="durText">0:00</span>
          </div>
        </div>
      </div>

      <div class="media__spectrum" id="spectrumWrap" hidden>
        <canvas id="spectrum"></canvas>
      </div>

      <div class="media__foot">
        <div class="transport">
          <button type="button" class="tbtn" id="prevBtn" title="Previous">
            <i class="ph ph-skip-back" aria-hidden="true"></i><span class="sr-only">Previous track</span>
          </button>
          <button type="button" class="tbtn tbtn--main" id="playBtn" title="Play or pause">
            <i class="ph ph-play" id="playIcon" aria-hidden="true"></i><span class="sr-only">Play or pause</span>
          </button>
          <button type="button" class="tbtn" id="nextBtn" title="Next">
            <i class="ph ph-skip-forward" aria-hidden="true"></i><span class="sr-only">Next track</span>
          </button>
        </div>

        <div class="volume" id="volumeWrap">
          <button type="button" class="iconbtn iconbtn--flush" id="muteBtn" title="Mute">
            <i class="ph ph-speaker-high" id="muteIcon" aria-hidden="true"></i>
            <span class="sr-only">Mute or unmute</span>
          </button>
          <input type="range" class="range range--vol" id="vol"
                 min="0" max="100" value="0" step="1" aria-label="System volume">
          <span class="num volume__pct" id="volText">--</span>
        </div>
      </div>
    </section>

    <!-- ------------------------------------------------------------ cpu -->
    <section class="tile tile--cpu">
      <div class="tile__head">
        <span class="tile__label"><i class="ph ph-cpu" aria-hidden="true"></i>Processor</span>
        <span class="tile__name" id="cpuName">&nbsp;</span>
      </div>

      <div class="readout">
        <div class="dial" id="cpuDial">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="dial__track" cx="60" cy="60" r="52"></circle>
            <circle class="dial__value" id="cpuArc" cx="60" cy="60" r="52"></circle>
          </svg>
          <div class="dial__center">
            <span class="dial__num num" id="cpuLoad">--</span><span class="dial__unit">%</span>
          </div>
        </div>

        <dl class="stats">
          <div class="stat"><dt>Temp</dt><dd class="num" id="cpuTemp">--</dd></div>
          <div class="stat"><dt>Power</dt><dd class="num" id="cpuPower">--</dd></div>
        </dl>
      </div>

      <div class="cores" id="cores" role="img" aria-label="Per-core load"></div>
    </section>

    <!-- ------------------------------------------------------------ gpu -->
    <section class="tile tile--gpu">
      <div class="tile__head">
        <span class="tile__label"><i class="ph ph-graphics-card" aria-hidden="true"></i>Graphics</span>
        <span class="tile__name" id="gpuName">&nbsp;</span>
      </div>

      <div class="readout">
        <div class="dial" id="gpuDial">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="dial__track" cx="60" cy="60" r="52"></circle>
            <circle class="dial__value" id="gpuArc" cx="60" cy="60" r="52"></circle>
          </svg>
          <div class="dial__center">
            <span class="dial__num num" id="gpuLoad">--</span><span class="dial__unit">%</span>
          </div>
        </div>

        <dl class="stats">
          <div class="stat"><dt>Temp</dt><dd class="num" id="gpuTemp">--</dd></div>
          <div class="stat"><dt>Hot spot</dt><dd class="num" id="gpuHot">--</dd></div>
          <div class="stat"><dt>Power</dt><dd class="num" id="gpuPower">--</dd></div>
          <div class="stat"><dt>Clock</dt><dd class="num" id="gpuClock">--</dd></div>
        </dl>
      </div>

      <div class="bar-row">
        <div class="bar-row__head">
          <span>VRAM</span><span class="num" id="vramText">--</span>
        </div>
        <div class="bar"><span class="bar__fill" id="vramBar"></span></div>
      </div>
    </section>

    <!-- --------------------------------------------------------- memory -->
    <section class="tile tile--mem">
      <div class="tile__head">
        <span class="tile__label"><i class="ph ph-memory" aria-hidden="true"></i>Memory</span>
      </div>

      <div class="mem">
        <div class="mem__figure">
          <span class="mem__num num" id="ramPct">--</span><span class="mem__unit">%</span>
        </div>
        <div class="mem__detail num" id="ramText">-- / -- GB</div>
      </div>

      <div class="ladder" id="ramLadder" role="img" aria-label="Memory in use"></div>

      <div class="mem__foot">
        <span class="meta"><span class="meta__k">Swap</span><span class="meta__v num" id="swapText">--</span></span>
      </div>
    </section>

  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/js/app.js"></script>
</body>
</html>
